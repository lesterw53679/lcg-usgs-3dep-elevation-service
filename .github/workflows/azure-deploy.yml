name: Deploy custom container to Azure App Service

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "sample_data/**"
      - "tests/**"
      - "README.md"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: lcg-usgs-3dep-elevation-service
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

concurrency:
  group: azure-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision being deployed
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgdal-dev

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -m "not integration"

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        run: |
          FULL_IMAGE_NAME="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$FULL_IMAGE_NAME" .
          docker push "$FULL_IMAGE_NAME"

      - name: Deploy image to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify the deployed health endpoint
        shell: bash
        run: |
          HEALTH_URL="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 "$HEALTH_URL"; then
              echo
              echo "Deployment health check succeeded: $HEALTH_URL"
              exit 0
            fi

            echo "Health check attempt $attempt of 30 did not succeed; retrying in 5 seconds."
            sleep 5
          done

          echo "Deployment health check failed after 30 attempts: $HEALTH_URL" >&2
          exit 1
