[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "usgs-elevation-service"
version = "0.1.0"
description = "A FastAPI service for querying USGS 3DEP point elevations."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "py3dep>=0.19,<0.20",
  "requests-cache>=1.2,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<10",
  "ruff>=0.9,<1.0",
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.6,<10.0",
]
notebooks = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that contact a live external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

